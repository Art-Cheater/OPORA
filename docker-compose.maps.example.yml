# Локальный пример Photon. Для дорожных маршрутов используйте
# docker-compose.routing.yml: он содержит закреплённый официальный Valhalla.
services:
  photon:
    image: komoot/photon:latest
    profiles: ["maps"]
    volumes:
      - ./data/photon:/photon/photon_data
    ports:
      - "2322:2322"
