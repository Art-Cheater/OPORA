# Кировсвет (kirovsvet.truthqwark.ru): TLS на общем nginx, страницы — в контейнере public-site.
server {
    listen 80;
    server_name kirovsvet.truthqwark.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kirovsvet.truthqwark.ru;

    ssl_certificate /etc/letsencrypt/live/kirovsvet.truthqwark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirovsvet.truthqwark.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/map.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $opora_web web;
        proxy_pass http://$opora_web:5000/public/kirovsvet/map.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $public_site_upstream public-site;
        proxy_pass http://$public_site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
