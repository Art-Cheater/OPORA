# Кировсвет, пока Let's Encrypt ещё не выпущен.
# Свой сертификат нужен сразу: иначе HTTPS этого имени попадает на CRM.
server {
    listen 80;
    server_name kirovsvet.truthqwark.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kirovsvet.truthqwark.ru;

    ssl_certificate /etc/nginx/site-enabled/kirovsvet-bootstrap.crt;
    ssl_certificate_key /etc/nginx/site-enabled/kirovsvet-bootstrap.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Кабинет: сессия нужна, куки не вырезаем.
    location /admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $public_site_upstream opora_public_site:80;
        proxy_pass http://$public_site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $public_site_upstream opora_public_site:80;
        proxy_pass http://$public_site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location = /auth {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 404 "not found\n";
    }
    location /auth/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 404 "not found\n";
    }
}
