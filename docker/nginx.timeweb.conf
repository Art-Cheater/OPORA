worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 64m;
    upstream gunicorn { server web:5000; keepalive 32; }

    # Пустая карта оставляет каждый хост на своём HTTPS.
    # Строка редиректа появляется только при OPORA_LEGACY_REDIRECT=1.
    map $host $public_https_host {
        default $host;
        include /etc/nginx/site-enabled/legacy-redirect-map.conf;
    }

    server {
        listen 80 default_server;
        server_name opora.truthqwark.ru opora.zheleznogame.ru;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        # Container-only liveness probe: no TLS redirect and no Flask dependency.
        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; access_log off; }
        location / { return 301 https://$public_https_host$request_uri; }
    }

    include /etc/nginx/site-enabled/legacy-site.conf;
    include /etc/nginx/site-enabled/public-https.conf;
    include /etc/nginx/site-enabled/public-site.conf;
}
