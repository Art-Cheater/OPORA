worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    upstream gunicorn { server web:5000; keepalive 32; }
    server {
        listen 80;
        server_name opora.zheleznogame.ru;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }
    server {
        listen 443 ssl http2;
        server_name opora.zheleznogame.ru;
        ssl_certificate /etc/letsencrypt/live/opora.zheleznogame.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/opora.zheleznogame.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location /static/ { alias /usr/share/nginx/html/static/; expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
        location / { proxy_pass http://gunicorn; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    }
}
