server {
    listen 443 ssl;
    http2 on;
    server_name opora.zheleznogame.ru;
    ssl_certificate /etc/letsencrypt/live/opora.zheleznogame.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opora.zheleznogame.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/proxy-locations.conf;
}
