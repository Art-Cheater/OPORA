worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    upstream gunicorn {
        server web:5000;
        keepalive 32;
    }

    server {
        listen 80;
        # HTTP/2 в браузере только по TLS. Сейчас выигрыш — gzip + статика с диска,
        # без занятия gunicorn-тредов. HTTPS/h2 — отдельным шагом с сертификатом.

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        location = /favicon.ico {
            alias /usr/share/nginx/html/static/favicon.ico;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location /health {
            proxy_pass http://gunicorn/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location / {
            proxy_pass http://gunicorn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
