# Кировсвет (kirovsvet.truthqwark.ru) без сертификата.
# Весь хост, включая карту заявок, идёт в контейнер public-site.
# CRM «Опора» этот server не обслуживает.
server {
    listen 80;
    server_name kirovsvet.truthqwark.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $public_site_upstream public-site;
        proxy_pass http://$public_site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
