# Timeweb production overlay. Keep docker-compose.yml unchanged for the current server.
services:
  nginx:
    # Compose !override prevents retaining the legacy host 5000:80 mapping.
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.timeweb.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERTS_DIR:-./data/certbot}:/etc/letsencrypt:ro

  tcp-gateway:
    # Runs the web image; a separate build would overwrite opora-web:latest
    # without LibreOffice.
    image: opora-web:latest
    container_name: opora_tcp_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      OPORA_RUN_MIGRATE: "0"
    command: ["python", "-m", "app.tcp_gateway.main"]
    ports:
      - "5000:5000"
    expose:
      - "8081"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Plain socket probe: importing the Flask app on every check exceeds the 5 s timeout.
      test: ["CMD", "python", "-c", "import os, socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('DEVICE_HEALTH_PORT', '8081'))), 3); assert s.recv(8).strip() == b'ok'; s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# The restored production uploads volume may pre-date Compose. Declaring it
# external stops Compose from trying to own/recreate it; base compose still
# creates uploads_data automatically for fresh/local installations.
volumes:
  uploads_data:
    external: true
    name: ${OPORA_UPLOADS_VOLUME:-opora_uploads_data}
