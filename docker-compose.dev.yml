# Только для локальной разработки. На сервере НЕ запускать:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Bind-mount .:/app на Windows/Docker Desktop сильно замедляет Python и Jinja.
services:
  web:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    volumes:
      - .:/app
      - uploads_data:/app/instance/uploads

  nginx:
    volumes:
      - ./app/static:/usr/share/nginx/html/static:ro
