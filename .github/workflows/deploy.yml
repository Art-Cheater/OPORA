name: Deploy

on:
  push:
    branches: [main]

# Только Linux self-hosted (Debian). Windows-runner в GitHub должен быть выключен.
jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Deploy
        env:
          OPORA_ROOT: ${{ vars.OPORA_ROOT }}
        run: |
          root="${OPORA_ROOT:-/opt/opora}"
          script="$root/scripts/deploy.sh"
          if [ ! -x "$script" ]; then
            echo "Не найден $script. Клонируйте репозиторий в $root (см. docs/SERVER_SETUP.md)."
            exit 1
          fi
          exec "$script"
