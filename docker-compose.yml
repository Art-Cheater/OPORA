services:
  db:
    image: postgres:16-alpine
    container_name: opora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opora_user} -d ${POSTGRES_DB:-opora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: opora_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Flask и Postgres в одной Docker-сети: хост БД всегда db
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "1"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',5000),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 45s

  eis-sync:
    build: .
    container_name: opora_eis_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "0"
    command: ["flask", "eis-sync", "--loop"]
    depends_on:
      db:
        condition: service_healthy

  inquiry-sync:
    build: .
    container_name: opora_inquiry_sync
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "0"
    command: ["flask", "inquiry-sync", "--loop"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
