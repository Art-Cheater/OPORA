services:
  db:
    image: postgres:17-alpine
    container_name: opora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opora_user} -d ${POSTGRES_DB:-opora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: opora_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "1"
    expose:
      - "5000"
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',5000),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 90s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: opora_nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  eis-sync:
    build: .
    container_name: opora_eis_sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "0"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["flask", "eis-sync", "--loop"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  inquiry-sync:
    build: .
    container_name: opora_inquiry_sync
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
      OPORA_RUN_MIGRATE: "0"
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: ["flask", "inquiry-sync", "--loop"]
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
