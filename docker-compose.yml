services:
  db:
    image: postgres:16-alpine
    container_name: opora_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт 5432 наружу не открываем: Windows часто блокирует 127.0.0.1:5432
    # (Hyper-V excluded ports). Сайт ходит в БД по сети Docker: db:5432.
    # Бэкап — docker exec / scripts/backup-db.ps1, не localhost:5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opora_user} -d ${POSTGRES_DB:-opora}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      autoheal: "true"
    networks:
      - opora

  web:
    build: .
    container_name: opora_web
    restart: always
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Flask и Postgres в одной Docker-сети: хост БД всегда db
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      autoheal: "true"
    networks:
      - opora

  # Если процесс жив, но /health не отвечает — перезапускает web/db.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: opora_autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "90"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - opora

volumes:
  postgres_data:
  uploads_data:

networks:
  opora:
    name: opora
