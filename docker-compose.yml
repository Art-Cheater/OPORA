services:
  db:
    image: postgres:16-alpine
    container_name: opora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-opora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opora_user} -d ${POSTGRES_DB:-opora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: opora_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Flask и Postgres в одной Docker-сети: хост БД всегда db
      POSTGRES_HOST: db
      DB_HOST: db
      DB_PORT: "5432"
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
