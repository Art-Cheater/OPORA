<form method="POST" action="{{ form_action }}" class="opora-modal-form" data-requests-form="1"
      {% if mode == 'edit' and req %}data-request-id="{{ req.id }}"{% endif %}>
    {{ form.hidden_tag() }}
    {% include "requests/partials/form_fields.html" %}
    <div class="modal-form-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        {{ form.submit(class="btn btn-primary") }}
    </div>
</form>
