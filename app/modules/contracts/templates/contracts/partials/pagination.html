{% if contracts_pagination.pages > 1 %}
<nav aria-label="Навигация по контрактам">
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item {% if not contracts_pagination.has_prev %}disabled{% endif %}">
            <a class="page-link contract-page-link" href="#" data-page="{{ contracts_pagination.prev_num }}">Назад</a>
        </li>
        {% for p in contracts_pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
            {% if p %}
                <li class="page-item {% if p == contracts_pagination.page %}active{% endif %}">
                    <a class="page-link contract-page-link" href="#" data-page="{{ p }}">{{ p }}</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">…</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {% if not contracts_pagination.has_next %}disabled{% endif %}">
            <a class="page-link contract-page-link" href="#" data-page="{{ contracts_pagination.next_num }}">Вперёд</a>
        </li>
    </ul>
</nav>
{% endif %}
