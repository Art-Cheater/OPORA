{% extends "layouts/public.html" %}

{% block title %}Ошибка сервера — {{ app_name }}{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-page__code">500</div>
    <h2 class="error-page__title">Внутренняя ошибка сервера</h2>
    <p class="text-muted mb-4">Произошла непредвиденная ошибка. Попробуйте позже.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">
        <i class="bi bi-house"></i> На главную
    </a>
</div>
{% endblock %}
