<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>

    {# Локальные CSS — без ожидания Google Fonts / внешних CDN при каждом клике #}
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet"
          onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}" rel="stylesheet"
          onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css'">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-messenger-unread-interval="{{ messenger_unread_interval_ms|default(15000) }}">
    {% block body %}{% endblock %}

    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"
            onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
