<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script>
    (function () {
        try {
            var t = localStorage.getItem("opora-theme");
            if (t !== "light" && t !== "dark") {
                t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
            document.documentElement.setAttribute("data-theme", "light");
        }
    })();
    </script>
    <link rel="icon" href="{{ static_url('favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" href="{{ static_url('favicon.png') }}">

    {# Локальные CSS. ?v=APP_VERSION — иначе nginx immutable держит старый JS после деплоя. #}
    <link href="{{ static_url('vendor/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ static_url('vendor/bootstrap-icons.min.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/main.css') }}" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-messenger-unread-interval="{{ messenger_unread_interval_ms|default(15000) }}">
    {% block body %}{% endblock %}

    <script src="{{ static_url('vendor/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ static_url('js/theme.js') }}"></script>
    <script src="{{ static_url('js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
